```svg
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 100 100"
     preserveAspectRatio="none"
     style="display:block;background:#111;">

  <!-- Make the SVG itself fill the browser -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>

  <!-- HTML UI -->
  <foreignObject x="0" y="0" width="100" height="100">

    <xhtml:div
      xmlns="http://www.w3.org/1999/xhtml"
      style="
        width:100vw;
        height:100vh;
        margin:0;
        padding:0;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:20px;
        background:#111;
        font-family:Arial,sans-serif;
      ">

      <xhtml:button
        id="lucideButton"
        type="button"
        style="
          width:168px;
          height:56px;
          padding:0;
          background:#222;
          color:#fff;
          border:1px solid #444;
          border-radius:0;
          font-family:Arial,sans-serif;
          font-size:17px;
          font-weight:700;
          cursor:pointer;
        ">
        Lucide
      </xhtml:button>

      <xhtml:button
        id="fernButton"
        type="button"
        style="
          width:168px;
          height:56px;
          padding:0;
          background:#222;
          color:#fff;
          border:1px solid #444;
          border-radius:0;
          font-family:Arial,sans-serif;
          font-size:17px;
          font-weight:700;
          cursor:pointer;
        ">
        Fern
      </xhtml:button>

    </xhtml:div>

  </foreignObject>

  <!-- SVG JavaScript -->
  <script><![CDATA[

    function openEmbedded(url) {

      /*
       * Open a real, separate about:blank tab.
       * This is called directly from the button's
       * click event, so popup blockers are much less
       * likely to interfere.
       */
      const tab = window.open("about:blank", "_blank");

      if (!tab) {
        alert("The browser blocked the new tab. Please allow popups for this page.");
        return;
      }

      /*
       * Construct the about:blank page.
       */
      tab.document.open();

      tab.document.write(
        '<!DOCTYPE html>' +
        '<html>' +
        '<head>' +
        '<meta charset="UTF-8">' +
        '<title>Embedded</title>' +
        '<style>' +
        'html,body {' +
          'margin:0;' +
          'padding:0;' +
          'width:100%;' +
          'height:100%;' +
          'overflow:hidden;' +
          'background:#000;' +
        '}' +

        'iframe {' +
          'display:block;' +
          'width:100%;' +
          'height:100%;' +
          'border:0;' +
        '}' +
        '</style>' +
        '</head>' +
        '<body>' +

        '<iframe ' +
          'src="' + url.replace(/"/g, '&quot;') + '" ' +
          'allowfullscreen>' +
        '</iframe>' +

        '</body>' +
        '</html>'
      );

      tab.document.close();
    }


    /*
     * Wait until the HTML inside foreignObject exists,
     * then attach normal JavaScript event listeners.
     */
    function setupButtons() {

      const lucide = document.getElementById("lucideButton");
      const fern = document.getElementById("fernButton");

      if (lucide) {
        lucide.addEventListener("click", function () {
          openEmbedded(
            "https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg"
          );
        });
      }

      if (fern) {
        fern.addEventListener("click", function () {
          openEmbedded(
            "https://s3.amazonaws.com/mathvc/index.html"
          );
        });
      }
    }

    /*
     * Run after the SVG has loaded.
     */
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupButtons);
    } else {
      setupButtons();
    }

  ]]></script>

</svg>
```
